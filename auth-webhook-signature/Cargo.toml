# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-auth-webhook-signature"
version = "1.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The webhook-signature auth mechanism: an inbound request authenticated by an HMAC keyed by a shared secret, as one auth-kind plugin on the auth kind's memory ABI. Variant `twilio`: X-Twilio-Signature (HMAC-SHA1 over the URL and, per request, its form parameters or bodySHA256); variant `standard-webhooks`: webhook-signature (HMAC-SHA256 over id.timestamp.body)."

# MOVED from busbar (crates/busbar-auth-webhook-signature at busbar 4bc63ac1a6, history imported;
# BUSBAR-1.6.0.md §9: every plugin lives in its own repo). The source is busbar's verbatim.

[lib]
# rlib only: the LINKED door (`busbar_auth_webhook_signature::door`) and the tests. The DROPPED door
# is the sibling `busbar-auth-webhook-signature-plugin` cdylib, the same door behind the one exported
# symbol, so this crate's own source stays `forbid(unsafe_code)` (SDK-SAFE).
crate-type = ["rlib"]

# DEPENDENCY POLICY. A plugin's closure is `busbar-contract` plus the third-party crates it needs to
# do its job (owner ruling 2026-09-28, PLUGIN LIBRARIES): JSON settings, the contract's wiped HMAC-SHA256 (`standard-webhooks`), `ring`'s HMAC-SHA1 (
# `twilio`; the SDK has no wiped SHA-1) and SHA-256, and base64. Every version is the
# workspace table's (busbar's at the pin).
[dependencies]
busbar-contract = { workspace = true }
base64 = { workspace = true }
ring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The signing key is wiped on drop (BUSBAR-1.6.0.md THE DESIGN §6: "auth material is zeroised").
zeroize = { workspace = true }
# Every reject is logged at info (module = "webhook-signature"), never silent; no credential in a line.
tracing = { workspace = true }

[dev-dependencies]
# The contract's test kit (`busbar_contract::testkit::WarnCapture`) for the reject-log tests.
busbar-contract = { workspace = true, features = ["test-seal"] }
