# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-auth-webhook-signature-plugin"
version = "1.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "First-party signed kind:auth plugin cdylib: the webhook-signature auth module, packaged as a droppable busbar plugin. Drop the signed tarball into plugins/."

[lib]
# cdylib: the DROPPED-IN door (a signed tarball in `plugins/`), exporting `busbar_plugin_door`.
# rlib: what `cargo test` links, and what makes `cargo test` emit the cdylib the conformance test
# loads (a cdylib-only package builds a trivial test harness and never produces the library).
crate-type = ["cdylib", "rlib"]

[dependencies]
busbar-auth-webhook-signature = { path = "../auth-webhook-signature" }
busbar-contract = { workspace = true }

[dev-dependencies]
# busbar's published conformance suite (`tests/conformance.rs`) and the door's own both-ways proof
# (`tests/door_both_ways.rs`) load the linked door and dlopen the built cdylib over busbar's REAL
# loader: dev-only, never in the shipped artifact.
busbar-plugin-loader = { workspace = true, features = ["conformance"] }
